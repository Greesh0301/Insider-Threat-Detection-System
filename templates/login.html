<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insider Threat Detector</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(5,15,30,.85),rgba(5,15,30,.90)),
    url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    overflow:hidden;
}

/* Animated Background */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle,#2d8cff22 2px,transparent 2px);
    background-size:40px 40px;
    animation:move 18s linear infinite;
}

@keyframes move{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(40px);
    }
}

/* Login Box */
.login-box{
    position:relative;
    z-index:2;
    width:430px;
    padding:40px;
    background:rgba(15,35,60,.92);
    border:1px solid #2d8cff;
    border-radius:20px;
    backdrop-filter:blur(12px);
    box-shadow:0 0 40px rgba(45,140,255,.25);
}

/* Logo */
.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo i{
    font-size:65px;
    color:#2d8cff;
    margin-bottom:15px;
}

.logo h1{
    font-size:30px;
    color:white;
}

.logo p{
    margin-top:8px;
    color:#b8d7ff;
    font-size:15px;
}

/* Flash Message */
.flash{
    background:#ff4d4d;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    text-align:center;
}

/* Input Group */
.input-group{
    margin-bottom:22px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:15px;
    color:#cfdfff;
}

.input-box{
    display:flex;
    align-items:center;
    background:#132846;
    border:1px solid #2d8cff;
    border-radius:12px;
    padding:0 15px;
    height:52px;
}

.input-box i{
    color:#2d8cff;
    font-size:18px;
    margin-right:12px;
}

.input-box input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
}

.input-box input::placeholder{
    color:#9bb8d7;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<i class="fa-solid fa-shield-halved"></i>
<h1>Insider Threat Detector</h1>
<p>Secure Employee Monitoring System</p>
</div>

{% with messages=get_flashed_messages() %}
{% if messages %}
<div class="flash">
{{ messages[0] }}
</div>
{% endif %}
{% endwith %}

<form method="POST">

<div class="input-group">
<label>Username</label>
<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" name="username" placeholder="Enter Username" required>
</div>
</div>

<div class="input-group">
<label>Password</label>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" name="password" placeholder="Enter Password" required>
</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;">

<label style="display:flex;align-items:center;color:#d6e8ff;font-size:14px;cursor:pointer;">
<input type="checkbox" id="showPassword" style="margin-right:8px;">
Show Password
</label>

<label style="display:flex;align-items:center;color:#d6e8ff;font-size:14px;cursor:pointer;">
<input type="checkbox" name="remember" style="margin-right:8px;">
Remember Me
</label>

</div>

<button
type="submit"
style="
width:100%;
height:52px;
background:#2d8cff;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
transition:.3s;
">
<i class="fa-solid fa-right-to-bracket"></i>
Login
</button>



</form>

</div>

<script>
document.getElementById("showPassword").addEventListener("change",function(){
    let password=document.getElementById("password");
    password.type=this.checked ? "text" : "password";
});
</script>

</body>
</html>
