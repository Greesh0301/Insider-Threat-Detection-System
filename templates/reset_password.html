<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reset Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;

height:100vh;

background:
linear-gradient(rgba(5,15,30,.85),rgba(5,15,30,.85)),
url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

}

.box{

width:430px;

background:#111c2f;

padding:35px;

border-radius:20px;

border:1px solid #2d8cff;

box-shadow:0 0 25px rgba(45,140,255,.3);

}

.box h2{

text-align:center;

margin-bottom:25px;

color:white;

}

.input-box{

position:relative;

margin-bottom:20px;

}

.input-box input{

width:100%;

height:48px;

padding-left:45px;

padding-right:45px;

background:#1b2942;

border:1px solid #2d8cff;

border-radius:10px;

color:white;

outline:none;

}

.input-box i:first-child{

position:absolute;

left:15px;

top:16px;

color:#2d8cff;

}

.eye{

position:absolute;

right:15px;

top:16px;

cursor:pointer;

color:#2d8cff;

}

button{

width:100%;

height:48px;

background:#2d8cff;

border:none;

border-radius:10px;

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1678f3;

}

.error{

margin-top:10px;

text-align:center;

color:#ff5d5d;

font-size:14px;

}

a{

display:block;

margin-top:20px;

text-align:center;

text-decoration:none;

color:#2d8cff;

}

</style>

</head>

<body>

<div class="box">

<h2>

<i class="fa-solid fa-lock"></i>

Reset Password

</h2>

<form method="POST" onsubmit="return validatePassword()">

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
name="password"
placeholder="New Password"
required>

<i class="fa-solid fa-eye eye"
onclick="togglePassword('password',this)"></i>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirm"
name="confirm"
placeholder="Confirm Password"
required>

<i class="fa-solid fa-eye eye"
onclick="togglePassword('confirm',this)"></i>

</div>

<div class="error" id="error"></div>

<button type="submit">

Update Password

</button>

</form>

<a href="/">Back to Login</a>

</div>

<script>

function togglePassword(id,icon){

let input=document.getElementById(id);

if(input.type==="password"){

input.type="text";

icon.classList.replace("fa-eye","fa-eye-slash");

}else{

input.type="password";

icon.classList.replace("fa-eye-slash","fa-eye");

}

}

function validatePassword(){

let p=document.getElementById("password").value;

let c=document.getElementById("confirm").value;

if(p!==c){

document.getElementById("error").innerHTML="Passwords do not match.";

return false;

}

if(p.length<8){

document.getElementById("error").innerHTML="Password must be at least 8 characters.";

return false;

}

return true;

}

</script>

</body>

</html>
