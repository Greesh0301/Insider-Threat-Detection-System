<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add User</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#071320;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}

/* ================= FORM BOX ================= */

.container{

width:550px;
background:#132846;
padding:35px;
border-radius:15px;
border:1px solid #2d8cff;
box-shadow:0 0 20px rgba(45,140,255,.25);

}

.container h2{

text-align:center;
color:#2d8cff;
margin-bottom:30px;
font-size:30px;

}

.container h2 i{

margin-right:10px;

}

/* ================= LABEL ================= */

label{

display:block;
color:white;
font-size:16px;
margin-bottom:8px;
margin-top:18px;

}

/* ================= INPUT ================= */

input,
select{

width:100%;
height:48px;
padding:12px 15px;
border:1px solid #2d8cff;
background:#0d1d34;
border-radius:8px;
color:white;
font-size:15px;
outline:none;
transition:.3s;

}

input:focus,
select:focus{

border-color:#55a6ff;
box-shadow:0 0 8px rgba(45,140,255,.5);

}

option{

background:#132846;
color:white;

}

/* ================= BUTTON ================= */

button{

width:100%;
height:50px;
margin-top:30px;
border:none;
border-radius:8px;
background:#2d8cff;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#1976f3;

}

/* ================= BACK BUTTON ================= */

.back{

display:block;
text-align:center;
margin-top:18px;
color:#2d8cff;
text-decoration:none;
font-size:16px;

}

.back:hover{

text-decoration:underline;

}

/* ================= RESPONSIVE ================= */

@media(max-width:650px){

.container{

width:95%;
padding:25px;

}

.container h2{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="container">

<h2>

<i class="fa-solid fa-user-plus"></i>

Add New User

</h2>

<form method="POST">

<label>Employee ID</label>

<input
type="text"
name="employee_id"
placeholder="EMP001"
required>

<label>Full Name</label>

<input
type="text"
name="fullname"
placeholder="Enter Full Name"
required>

<label>Username</label>

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="example@gmail.com"
required>

<label>Department</label>

<select name="department" required>

<option value="">Select Department</option>

<option>Cyber Security</option>
<option>IT</option>
<option>HR</option>
<option>Finance</option>
<option>Sales</option>
<option>Marketing</option>
<option>Operations</option>

</select>

<label>Role</label>

<select name="role" required>

<option value="">Select Role</option>

<option>Admin</option>
<option>Employee</option>

</select>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Create Password"
required>

<button type="submit">

<i class="fa-solid fa-user-plus"></i>

Add User

</button>

</form>

<a href="/users" class="back">

<i class="fa-solid fa-arrow-left"></i>

Back to Users

</a>

</div>

</body>

</html>
