<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>System Settings</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#071320;
color:white;
display:flex;

}

/* Sidebar */

.sidebar{
width:260px;
height:100vh;
position:fixed;
left:0;
top:0;
background:#0d1d34;
border-right:1px solid #204d86;
}

.logo{
text-align:center;
padding:25px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo i{
font-size:55px;
color:#2d8cff;
}

.logo h2{
margin-top:12px;
font-size:22px;
line-height:34px;
}

.sidebar ul {
margin-top:20px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:18px 28px;
font-size:18px;
transition:.3s;
margin:8px 12px;
border-radius:12px;
}

.sidebar ul a i{
width:35px;
}

.sidebar a:hover{
background:#2d8cff;
}

.active{
background:#2d8cff;
}


/* Main */

.main{
margin-left:260px;
width:calc(100% - 260px);

}
/* Header */

.header{
height:80px;
background:#132846;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 35px;
border-bottom:1px solid #245996;
}

.header h1{
font-size:34px;
}

.profile{
display:flex;
align-items:center;
gap:15px;
}

.profile i{
font-size:36px;
color:#2d8cff;
}

/* ================= Content ================= */

.content{
padding:35px;
}


/* Setting Box */

.setting-box{

background:#162b49;

border:1px solid #2d8cff;

border-radius:18px;

padding:30px;

margin-bottom:25px;

}

.setting-box h2{

margin-bottom:25px;

font-size:24px;

}

.setting{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 0;

border-bottom:1px solid #28486d;

}

.setting:last-child{

border:none;

}

.setting label{

font-size:18px;

}

/* Toggle Switch */

.switch{

position:relative;

display:inline-block;

width:60px;

height:30px;

}

.switch input{

display:none;

}

.slider{

position:absolute;

cursor:pointer;

top:0;

left:0;

right:0;

bottom:0;

background:#666;

transition:.4s;

border-radius:30px;

}

.slider:before{

content:"";

position:absolute;

width:22px;

height:22px;

left:4px;

bottom:4px;

background:white;

transition:.4s;

border-radius:50%;

}

input:checked + .slider{

background:#2d8cff;

}

input:checked + .slider:before{

transform:translateX(30px);

}

.save{

margin-top:30px;

text-align:right;

}

.save button{

background:#2d8cff;

color:white;

border:none;

padding:14px 35px;

border-radius:10px;

font-size:17px;

cursor:pointer;

}

.save button:hover{

background:#1978f3;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<i class="fa-solid fa-shield-halved"></i>

<h2>Insider Threat Detector</h2>

</div>

 <ul>

        <li>
            <a href="/dashboard">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li>
            <a href="/activity">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Activity Logs</span>
            </a>
        </li>

        <li>
            <a href="/alerts">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Alerts</span>
            </a>
        </li>

        <li>
            <a href="/usb_history">
                <i class="fa-solid fa-usb"></i>
                <span>USB History</span>
            </a>
        </li>
            
        <li>
            <a href="/file_history">
                <i class="fa-solid fa-folder-open"></i>
                <span>File History</span>
            </a>
        </li>

        <li>
            <a href="/reports">
                <i class="fa-solid fa-file-lines"></i>
                <span>Reports</span>
            </a>
        </li> 
            
        <li>
            <a href="/users">
                <i class="fa-solid fa-users"></i>
                <span>Users</span>
            </a>
        </li>

        <li>
            <a href="/settings"  class="active">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </li>

        <li>
            <a href="/logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </li>

    </ul>


</ul>

</div>

<div class="main">

<div class="header">

<h1>System Settings</h1>

<div class="profile">

<i class="fa-solid fa-circle-user"></i>

<div>

<b>{{username}}</b><br>

{{role}}

</div>

</div>

</div>

<div class="content">

<div class="setting-box">

<h2>

<i class="fa-solid fa-sliders"></i>

Monitoring Settings

</h2>
<form method="POST">

<div class="setting">

<label>

<i class="fa-solid fa-usb" style="color:#2d8cff;"></i>

USB Monitoring

</label>

<label class="switch">

<input

type="checkbox"

name="usb_monitor"

{% if settings.usb_monitor %}checked{% endif %}>

<span class="slider"></span>

</label>

</div>

<div class="setting">

<label>

<i class="fa-solid fa-folder-open" style="color:#2d8cff;"></i>

File Monitoring

</label>

<label class="switch">

<input

type="checkbox"

name="file_monitor"

{% if settings.file_monitor %}checked{% endif %}>

<span class="slider"></span>

</label>

</div>

<div class="setting">

<label>

<i class="fa-solid fa-user-shield" style="color:#2d8cff;"></i>

Login Monitoring

</label>

<label class="switch">

<input

type="checkbox"

name="login_monitor"

{% if settings.login_monitor %}checked{% endif %}>

<span class="slider"></span>

</label>

</div>

<div class="setting">

<label>

<i class="fa-solid fa-envelope" style="color:#2d8cff;"></i>

Email Alert Notifications

</label>

<label class="switch">

<input

type="checkbox"

name="email_alert"

{% if settings.email_alert %}checked{% endif %}>

<span class="slider"></span>

</label>

</div>

<div class="setting">

<label>

<i class="fa-solid fa-database" style="color:#2d8cff;"></i>

Automatic Backup

</label>

<label class="switch">

<input

type="checkbox"

name="backup"

{% if settings.backup %}checked{% endif %}>

<span class="slider"></span>

</label>

</div>

<div class="setting">

<label>

<i class="fa-solid fa-clock" style="color:#2d8cff;"></i>

Scan Interval

</label>

<select
name="scan_interval"
style="

width:180px;
height:42px;
background:#132846;
border:1px solid #2d8cff;
color:white;
border-radius:10px;
padding:0 10px;
outline:none;

">

<option value="5">Every 5 Minutes</option>

<option value="10">Every 10 Minutes</option>

<option value="30">Every 30 Minutes</option>

<option value="60">Every 1 Hour</option>

</select>

</div>

<div class="save">

<button type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Save Settings

</button>

</div>

</form>

</div>

</div>

<script>

document.querySelector("form").addEventListener("submit",function(){

alert("Settings Saved Successfully.");

});

</script>

</body>

</html>
