<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Forgot Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;

height:100vh;

background:
linear-gradient(rgba(6,16,30,.85),rgba(6,16,30,.85)),
url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

}

.box{

width:420px;

background:#111c2f;

padding:35px;

border-radius:18px;

border:1px solid #2d8cff;

box-shadow:0 0 25px rgba(45,140,255,.25);

}

.box h2{

text-align:center;

margin-bottom:25px;
color: white;

}

.input-box{

position:relative;

margin-bottom:20px;

}

.input-box i{

position:absolute;

left:15px;

top:16px;

color:#2d8cff;

}

.input-box input{

width:100%;

height:48px;

padding-left:45px;

background:#1b2942;

border:1px solid #2d8cff;

border-radius:10px;

color:white;

outline:none;

}

button{

width:100%;

height:48px;

background:#2d8cff;

border:none;

border-radius:10px;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#1876ef;

}

.flash{

background:#ff4d4d;

padding:12px;

margin-bottom:20px;

border-radius:8px;

text-align:center;

}

a{

display:block;

text-align:center;

margin-top:20px;

color:#2d8cff;

text-decoration:none;

}

</style>

</head>

<body>

<div class="box">

<h2>

<i class="fa-solid fa-key"></i>

Forgot Password

</h2>

{% with messages=get_flashed_messages() %}

{% if messages %}

<div class="flash">

{{messages[0]}}

</div>

{% endif %}

{% endwith %}

<form method="POST">

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
name="email"
placeholder="Registered Email"
required>

</div>

<button>

Verify Account

</button>

</form>

<a href="/">Back to Login</a>

</div>

</body>
</html>
